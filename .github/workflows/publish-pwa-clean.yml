name: Publish PWA - clean pipeline
on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/publish-pwa-clean.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-clean-deploy
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy PWA
        id: deployment
        uses: actions/deploy-pages@v4
